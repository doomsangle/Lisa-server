# MetoE 管理平台 - Nginx 站点配置
# 将此文件放到 /etc/nginx/conf.d/metoe.conf 或 /etc/nginx/sites-enabled/metoe.conf
# 然后：nginx -t && systemctl reload nginx

# ========== HTTP → HTTPS 跳转（可选，有 SSL 证书时启用）==========
# server {
#     listen 80;
#     server_name metoe.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;   # 有 SSL 时启用
    server_name _;             # 改成你的域名，如 metoe.example.com

    # ========== SSL 证书配置（可选）==========
    # ssl_certificate     /etc/nginx/ssl/metoe.crt;
    # ssl_certificate_key /etc/nginx/ssl/metoe.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端静态文件目录（npm run build 后的输出目录）
    root /var/www/metoe/dist;
    index index.html;

    # 日志
    access_log /var/log/nginx/metoe.access.log;
    error_log  /var/log/nginx/metoe.error.log;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ========== 后端 API 反向代理 ==========
    # 所有 /api 请求转发到 FastAPI 后端（uvicorn 默认 8000 端口）
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 上传大小限制（部署文件、密钥等）
        client_max_body_size 50m;

        # 超时（IP 检测等耗时接口可能需要较长时间）
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;

        # 处理 307/308 重定向（FastAPI 末尾斜杠规范化）
        proxy_redirect off;
    }

    # ========== WebSocket 支持（如果后端有实时推送功能）==========
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 86400;
    # }

    # ========== 前端 Vue Router history 模式 ==========
    # 所有非 API、非静态文件的请求都返回 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # HTML 不缓存，保证前端热更新
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
        }
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
