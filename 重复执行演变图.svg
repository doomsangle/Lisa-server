<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="cardD" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" rx="12"/>
  <text x="700" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#f1f5f9">
    vpn.sh 重复执行 → 输出目录 &amp; 链接变化全景图
  </text>
  <text x="700" y="85" text-anchor="middle" font-size="16" fill="#94a3b8">
    (VPN 服务端链接 / 二维码 内容完全不变，仅每次刷新时新建"日期-序号"快照目录，latest 软链跳转)
  </text>

  <!-- ===== Row labels (columns headers) -->
  <g font-size="15" fill="#cbd5e1">
    <rect x="40"   y="115" width="140" height="34" rx="8" fill="#334155"/>
    <text x="110" y="137" text-anchor="middle" font-weight="bold">执行次数</text>

    <rect x="210"  y="115" width="220" height="34" rx="8" fill="#334155"/>
    <text x="320" y="137" text-anchor="middle" font-weight="bold">核心动作</text>

    <rect x="460"  y="115" width="380" height="34" rx="8" fill="#334155"/>
    <text x="650" y="137" text-anchor="middle" font-weight="bold">/etc/s-box/output/ 目录结构</text>

    <rect x="870"  y="115" width="250" height="34" rx="8" fill="#334155"/>
    <text x="995" y="137" text-anchor="middle" font-weight="bold">VPN 链接 / 二维码内容</text>

    <rect x="1150" y="115" width="210" height="34" rx="8" fill="#334155"/>
    <text x="1255" y="137" text-anchor="middle" font-weight="bold">latest 软链 &amp; 访问</text>
  </g>

  <!-- ===== Step 1: 第1次执行 -->
  <g filter="url(#shadow)">
    <rect x="40"   y="170" width="140" height="130" rx="14" fill="url(#cardA)" opacity="0.92"/>
    <text x="110" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b1e31">第 1 次</text>
    <text x="110" y="240" text-anchor="middle" font-size="15" fill="#0b1e31">全新服务器</text>
    <text x="110" y="265" text-anchor="middle" font-size="15" fill="#0b1e31">(安装 + 分享)</text>
    <text x="110" y="290" text-anchor="middle" font-size="13" fill="#0b1e31" opacity="0.8">bash vpn.sh</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="170" width="220" height="130" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text x="320" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#22d3ee">① 安装 sing-box</text>
    <text x="235" y="228" font-size="14" fill="#e2e8f0">• 生成随机端口 / UUID /</text>
    <text x="235" y="250" font-size="14" fill="#e2e8f0">  自签证书 / Reality 密钥</text>
    <text x="320" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#22d3ee">② 输出 HTML 页面</text>
  </g>

  <g font-family="Consolas, monospace" font-size="13" fill="#e2e8f0" filter="url(#shadow)">
    <rect x="460" y="170" width="380" height="130" rx="14" fill="#020617" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="480" y="198" fill="#22d3ee" font-weight="bold">output/</text>
    <text x="500" y="220">├── 20240717-1/   </text><text x="740" y="220" fill="#facc15">← NEW</text>
    <text x="520" y="240">│   ├── index.html   </text><text x="720" y="240" fill="#94a3b8">VPN 页面</text>
    <text x="520" y="258">│   ├── vl_reality.txt / .png</text>
    <text x="520" y="276">│   ├── vm_ws.txt / .png</text>
    <text x="520" y="294">│   └── jhsub.txt</text>
    <text x="500" y="312">└── latest  →  20240717-1  </text><text x="800" y="312" fill="#facc15">← NEW</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="170" width="250" height="130" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="995" y="205" text-anchor="middle" font-size="20" font-weight="bold" fill="#22c55e">首 次 生 成</text>
    <text x="895" y="235" font-size="14" fill="#e2e8f0">• Vless-Reality 链接 A</text>
    <text x="895" y="257" font-size="14" fill="#e2e8f0">• Vmess-WS / TLS 链接 B</text>
    <text x="895" y="279" font-size="14" fill="#e2e8f0">• Hysteria2 / Tuic5 链接 C,D</text>
    <text x="995" y="305" text-anchor="middle" font-size="13" fill="#94a3b8">(写入 sb.json，永固)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="170" width="210" height="130" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text x="1255" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#22d3ee">latest → /20240717-1</text>
    <text x="1255" y="235" text-anchor="middle" font-size="15" fill="#e2e8f0">http://IP/</text>
    <text x="1255" y="258" text-anchor="middle" font-size="15" fill="#94a3b8">↓ 302 重定向</text>
    <text x="1255" y="283" text-anchor="middle" font-size="15" fill="#e2e8f0">http://IP/latest/</text>
    <text x="1255" y="308" text-anchor="middle" font-size="13" fill="#94a3b8">→ 展示 index.html</text>
  </g>

  <!-- Arrow between rows -->
  <line x1="700" y1="305" x2="700" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 2: 第2次执行 ===== -->
  <g filter="url(#shadow)">
    <rect x="40"   y="345" width="140" height="130" rx="14" fill="url(#cardB)" opacity="0.92"/>
    <text x="110" y="385" text-anchor="middle" font-size="20" font-weight="bold" fill="#052e25">第 2 次</text>
    <text x="110" y="415" text-anchor="middle" font-size="15" fill="#052e25">检测到 sing-box</text>
    <text x="110" y="440" text-anchor="middle" font-size="15" fill="#052e25">已安装</text>
    <text x="110" y="465" text-anchor="middle" font-size="13" fill="#052e25" opacity="0.8">bash vpn.sh</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="345" width="220" height="130" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="320" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#34d399">① 安装步骤 SKIP</text>
    <text x="235" y="403" font-size="14" fill="#94a3b8">• sb.json 原封不动 ✅</text>
    <text x="320" y="435" text-anchor="middle" font-size="16" font-weight="bold" fill="#34d399">② 仅重新渲染</text>
    <text x="240" y="460" font-size="14" fill="#e2e8f0">刷新分享 → 新快照目录</text>
  </g>

  <g font-family="Consolas, monospace" font-size="13" fill="#e2e8f0" filter="url(#shadow)">
    <rect x="460" y="345" width="380" height="130" rx="14" fill="#020617" stroke="#34d399" stroke-width="1.5"/>
    <text x="480" y="373" fill="#34d399" font-weight="bold">output/</text>
    <text x="500" y="395">├── 20240717-1/  </text><text x="720" y="395" fill="#94a3b8"> 保留不变</text>
    <text x="520" y="413">│   └── (所有文件 ✔</text>
    <text x="500" y="433">├── 20240717-2/   </text><text x="740" y="433" fill="#facc15">← NEW (#2 快照)</text>
    <text x="520" y="451">│   ├── index.html  (与-1完全相同)</text>
    <text x="520" y="469">│   └── 所有txt / png</text>
    <text x="500" y="487">└── latest  →  20240717-2 </text><text x="800" y="487" fill="#34d399">已切换 ✅</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="345" width="250" height="130" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="995" y="380" text-anchor="middle" font-size="22" font-weight="bold" fill="#22c55e">内 容 完 全 不 变</text>
    <text x="995" y="420" text-anchor="middle" font-size="15" fill="#e2e8f0">Vless A · Vmess B · Hy2 C</text>
    <text x="995" y="445" text-anchor="middle" font-size="15" fill="#e2e8f0">Tuic5 D · Anytls · jhsub</text>
    <text x="995" y="472" text-anchor="middle" font-size="13" fill="#fbbf24">🔗 链接与正在使用的完全一致</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="345" width="210" height="130" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="1255" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#34d399">latest → /20240717-2</text>
    <text x="1255" y="410" text-anchor="middle" font-size="15" fill="#e2e8f0">latest 软链指向新目录</text>
    <text x="1255" y="435" text-anchor="middle" font-size="15" fill="#94a3b8">正在使用的节点</text>
    <text x="1255" y="460" text-anchor="middle" font-size="15" fill="#22c55e">✅ 不中断 / 不失效</text>
  </g>

  <line x1="700" y1="480" x2="700" y2="505" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 3: N 次执行 ===== -->
  <g filter="url(#shadow)">
    <rect x="40"   y="520" width="140" height="130" rx="14" fill="url(#cardD)" opacity="0.92"/>
    <text x="110" y="560" text-anchor="middle" font-size="20" font-weight="bold" fill="#3b2a05">第 N 次</text>
    <text x="110" y="590" text-anchor="middle" font-size="15" fill="#3b2a05">(N ≥ 3)</text>
    <text x="110" y="615" text-anchor="middle" font-size="15" fill="#3b2a05">多次刷新</text>
    <text x="110" y="640" text-anchor="middle" font-size="13" fill="#3b2a05" opacity="0.8">bash vpn.sh</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="520" width="220" height="130" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="320" y="550" text-anchor="middle" font-size="16" font-weight="bold" fill="#fbbf24">行为完全同 #2</text>
    <text x="235" y="578" font-size="14" fill="#e2e8f0">• 每 100% 历史目录均保留</text>
    <text x="235" y="600" font-size="14" fill="#e2e8f0">• 可随时回退到任意快照</text>
    <text x="320" y="630" text-anchor="middle" font-size="15" fill="#fbbf24">历史可回溯 · 失败可回退</text>
  </g>

  <g font-family="Consolas, monospace" font-size="13" fill="#e2e8f0" filter="url(#shadow)">
    <rect x="460" y="520" width="380" height="130" rx="14" fill="#020617" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="480" y="548" fill="#fbbf24" font-weight="bold">output/</text>
    <text x="500" y="570">├── 20240717-1/  保留 (第1次)</text>
    <text x="500" y="588">├── 20240717-2/  保留 (第2次)</text>
    <text x="500" y="606">├── …</text>
    <text x="500" y="624">├── 20240717-N/  </text><text x="730" y="624" fill="#facc15">← NEW (第 N 次快照)</text>
    <text x="520" y="642">│   └── index.html  (链接 / 二维码与第1次同源</text>
    <text x="500" y="662">└── latest  →  20240717-N </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="520" width="250" height="130" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="995" y="558" text-anchor="middle" font-size="20" font-weight="bold" fill="#f43f5e">始 终 不 变 ❤</text>
    <text x="995" y="595" text-anchor="middle" font-size="14" fill="#e2e8f0">只要 sb.json 的 port / UUID /</text>
    <text x="995" y="618" text-anchor="middle" font-size="14" fill="#e2e8f0">证书 / SNI 不手改</text>
    <text x="995" y="645" text-anchor="middle" font-size="15" fill="#fbbf24">🔒 客户端零中断，永不变</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="520" width="210" height="130" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="1255" y="555" text-anchor="middle" font-size="16" font-weight="bold" fill="#fbbf24">始终指向最新</text>
    <text x="1255" y="585" text-anchor="middle" font-size="14" fill="#e2e8f0">http://IP/latest/</text>
    <text x="1255" y="610" text-anchor="middle" font-size="14" fill="#94a3b8">↓ 服务器IP/域名 不用改</text>
    <text x="1255" y="635" text-anchor="middle" font-size="13" fill="#22c55e">✅ 每次都是同一页面</text>
  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(40, 685)">
    <rect width="1320" height="55" rx="12" fill="#020617" stroke="#475569"/>
    <g font-family="Consolas" font-size="14" fill="#cbd5e1">
      <circle cx="30"  cy="28" r="9" fill="#22d3ee"/>
      <text x="50"  y="32">第 1 次</text>
      <text x="130" y="32" fill="#94a3b8">完整安装 + 新建</text>

      <circle cx="260" cy="28" r="9" fill="#34d399"/>
      <text x="280" y="32">第 2+ 次</text>
      <text x="360" y="32" fill="#94a3b8">跳过安装 · 链接不变</text>

      <circle cx="490" cy="28" r="9" fill="#fbbf24"/>
      <text x="510" y="32">第 N 次</text>
      <text x="590" y="32" fill="#94a3b8">历史可回滚 · 最新切换 latest</text>

      <text x="760" y="32" fill="#f43f5e" font-weight="bold">核心结论：</text>
      <text x="845" y="32" fill="#e2e8f0">反复执行 vpn.sh</text>
      <text x="995" y="32" fill="#22c55e" font-weight="bold">✅ 链接 &amp; 二维码 不 变</text>
      <text x="1150" y="32" fill="#e2e8f0">正在使用的节点</text>
      <text x="1260" y="32" fill="#22c55e" font-weight="bold">零 中 断 、 零 失 效</text>
    </g>
  </g>

</svg>
